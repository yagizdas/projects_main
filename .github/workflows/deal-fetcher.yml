name: Fetch grocery deals

on:
  schedule:
    - cron: "0 11 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch offers
        run: python ideas/deal-fetcher/fetch_deals.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ideas/deal-fetcher/data
          git diff --cached --quiet || git commit -m "Update grocery deal data"
          git push origin HEAD:main
