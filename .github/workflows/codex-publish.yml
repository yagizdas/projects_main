name: Publish Codex patch

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  publish:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.id == 199175422 &&
      contains(github.event.comment.body, 'CODEX_PATCH_RESULT ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Publish validated patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_codex_patch.py
